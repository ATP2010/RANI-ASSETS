<!doctype html>
<html lang="{{ t('login.html_lang') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login.title') }}</title>
  <meta name="description" content="RANI (Resource &amp; Asset Network Intelligence) — {{ t('login.msg') }}">
  <link rel="icon" href="/static/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon-180.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/adminlte.min.css">
</head>
<body class="login-page bg-body-secondary">
<div class="login-box">
  <div class="login-logo">
    <img src="/static/img/rani-logo-512.png" alt="RANI" width="96" height="96" class="mb-2">
    <div><span class="fw-semibold">RANI</span></div>
    <div class="small-muted" style="font-size:.78rem; letter-spacing:.02em">
      {{ t('login.tagline') }}
    </div>
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">{{ t('login.msg') }}</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="username">{{ t('login.username') }}</label>
          <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">{{ t('login.password') }}</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">{{ t('login.submit') }}</button>
      </form>
      <div class="d-flex justify-content-center gap-3 mt-3 small">
        <a href="/lang/id?next={{ request.url.path }}" class="{{ 'fw-semibold' if lang() == 'id' else 'small-muted' }}">Bahasa Indonesia</a>
        <a href="/lang/en?next={{ request.url.path }}" class="{{ 'fw-semibold' if lang() == 'en' else 'small-muted' }}">English</a>
      </div>
    </div>
  </div>
</div>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
