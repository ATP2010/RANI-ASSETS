{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ t('docs.title') }}{% endblock %}
{% block subheading %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="mono">{{ title }}</span>
    <span class="small-muted">{{ t('docs.source') | safe }}</span>
  </div>
  <div class="card-body">
    <pre class="mb-0 p-3 bg-body-secondary rounded mono" style="white-space: pre-wrap">{{ body }}</pre>
  </div>
</div>
{% endblock %}
