name: rani-inv

x-server: &server
  build:
    context: .
    dockerfile: server/Dockerfile
  image: ${RANI_IMAGE:-rani-server:dev}
  env_file:
    - .env
  environment:
    TZ: ${TZ:-Asia/Jakarta}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rani}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-rani}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rani}
      POSTGRES_USER: ${POSTGRES_USER:-rani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rani} -d ${POSTGRES_DB:-rani}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data
    networks: [internal]
    restart: unless-stopped

  api:
    <<: *server
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --workers 2
    ports:
      - "${RANI_HTTP_PORT:-8091}:8000"
    volumes:
      # Artefak agent untuk /downloads (read-only). Dibuat scripts/build-*.sh di host.
      - ./release:/srv/release:ro
      - ./scripts:/srv/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, internal]

  worker:
    <<: *server
    command: ["python", "-m", "worker.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata: